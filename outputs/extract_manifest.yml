known_limitations:
- Attendance completeness is lower during academic year 2020. Consider a sensitivity
  analysis excluding 2020.
- Education linkage rates differ across deprivation quintiles. Compare linked and
  unlinked groups before interpreting subgroup results.
- This is a descriptive feasibility assessment using synthetic data. It is not a causal-effect
  estimate.
public_output_note: Aggregate-only synthetic portfolio output. Row-level extracts
  are not exposed.
