  birth_year_min: 2010
  birth_year_max: 2015
  regions: []
  deprivation_quintiles: []
  min_follow_up_years: 2
  index_year_min: 2018
  index_year_max: 2022
  school_inception_year: 2020
  diagnosis_group: Respiratory
  require_health: true
  require_education: true
  require_social_care: false
  outcome_phenotype: persistent_school_absence
